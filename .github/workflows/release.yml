name: Audit public release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to audit (for example, v0.3.6)
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$TAG"
          version="${tag#v}"
          installer="WinecloudsStudio-Setup-${version}-win-x64.exe"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          jq -e --arg tag "$tag" \
            '.tagName == $tag and (.isDraft | not) and (.isPrerelease | not)' \
            <<<"$release_json" >/dev/null

          expected_names=$(printf '%s\n' \
            "$installer" \
            "${installer}.sha256" \
            "update.json" | sort)
          actual_names=$(jq -r '.assets[].name' <<<"$release_json" | sort)
          if [[ "$actual_names" != "$expected_names" ]]; then
            echo 'Release assets do not match the required three-file set.' >&2
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi

          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$workdir" \
            --pattern "$installer" \
            --pattern "${installer}.sha256" \
            --pattern update.json

          actual_hash="$(sha256sum "$workdir/$installer" | awk '{print $1}')"
          expected_hash="$(awk 'NF {print $1; exit}' "$workdir/${installer}.sha256")"
          [[ "$actual_hash" == "$expected_hash" ]]

          jq -e \
            '.schemaVersion == 2
             and .signatureAlgorithm == "ecdsa-p256-sha256"
             and (.signature | type == "string" and length > 0)
             and (.payload | type == "string" and length > 0)' \
            "$workdir/update.json" >/dev/null

          payload_file="$workdir/payload.json"
          jq -r '.payload' "$workdir/update.json" | base64 --decode > "$payload_file"
          installer_size="$(stat -c '%s' "$workdir/$installer")"
          jq -e \
            --arg version "$version" \
            --arg tag "$tag" \
            --arg name "$installer" \
            --arg size "$installer_size" \
            --arg sha "$actual_hash" \
            '.version == $version
             and .tagName == $tag
             and .installer.name == $name
             and (.installer.size | tostring) == $size
             and .installer.sha256 == $sha' \
            "$payload_file" >/dev/null

          echo "Release $tag passed the public asset audit."
          echo "Installer: $installer ($installer_size bytes)"
          echo "SHA-256: $actual_hash"
