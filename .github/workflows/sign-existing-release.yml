name: Sign an existing release manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (for example, v0.3.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign:
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download and verify installer
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format."
          }

          $version = $tag.TrimStart('v')
          $installerName = "WinecloudsStudio-Setup-$version-win-x64.exe"
          $artifactDirectory = Join-Path $PWD 'release-artifacts'
          New-Item -ItemType Directory -Path $artifactDirectory -Force |
            Out-Null

          $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Release $tag does not exist."
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft) {
            throw "Release $tag is still a draft."
          }

          $assetsJson =
            gh api "repos/$env:GH_REPO/releases/$($release.id)/assets"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list assets for $tag."
          }
          $matchingAssets = @(
            $assetsJson |
              ConvertFrom-Json |
              Where-Object {
                $_.name -eq $installerName -and
                $_.state -eq 'uploaded'
              }
          )
          if ($matchingAssets.Count -ne 1) {
            throw "Expected one uploaded $installerName asset on $tag."
          }

          $installer = Join-Path $artifactDirectory $installerName
          Invoke-WebRequest `
            -Uri $matchingAssets[0].browser_download_url `
            -OutFile $installer
          if ((Get-Item -LiteralPath $installer).Length -ne
              $matchingAssets[0].size) {
            throw "Release installer size does not match the asset record."
          }

          $hash = (Get-FileHash `
            -LiteralPath $installer `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$installer.sha256"
          "$hash  $installerName" |
            Set-Content -LiteralPath $checksum -Encoding ascii

          "tag=$tag" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer=$installer" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$checksum" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate and upload signed manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY_PKCS8_BASE64 }}
        run: |
          $tag = "${{ steps.artifact.outputs.tag }}"
          $version = "${{ steps.artifact.outputs.version }}"
          $installer =
            Get-Item -LiteralPath "${{ steps.artifact.outputs.installer }}"
          $checksum = "${{ steps.artifact.outputs.checksum }}"
          $hash = "${{ steps.artifact.outputs.sha256 }}"
          $release =
            gh release view $tag `
              --json name,body,publishedAt,url,isDraft |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read release $tag."
          }

          $publishedAt = $release.publishedAt
          if ([string]::IsNullOrWhiteSpace($publishedAt)) {
            $publishedAt = [DateTimeOffset]::UtcNow.ToString('O')
          }

          $manifestPayload = [ordered]@{
            schemaVersion = 1
            version = $version
            tagName = $tag
            name = $release.name
            releaseNotes = $release.body
            releasePageUrl = "https://github.com/$env:GH_REPO/releases/tag/$tag"
            publishedAt = $publishedAt
            installer = [ordered]@{
              name = $installer.Name
              downloadUrl =
                "https://github.com/$env:GH_REPO/releases/download/$tag/$($installer.Name)"
              size = $installer.Length
              sha256 = $hash
            }
          }

          if ([string]::IsNullOrWhiteSpace(
              $env:UPDATE_MANIFEST_SIGNING_KEY)) {
            throw 'UPDATE_MANIFEST_SIGNING_KEY_PKCS8_BASE64 is not configured.'
          }

          $payloadJson =
            $manifestPayload |
              ConvertTo-Json -Depth 4 -Compress
          $payloadBytes =
            [Text.UTF8Encoding]::new($false).GetBytes($payloadJson)
          $privateKeyBytes =
            [Convert]::FromBase64String($env:UPDATE_MANIFEST_SIGNING_KEY)
          $signer = [Security.Cryptography.ECDsa]::Create()
          try {
            $bytesRead = 0
            $signer.ImportPkcs8PrivateKey(
              $privateKeyBytes,
              [ref]$bytesRead)
            if ($bytesRead -ne $privateKeyBytes.Length) {
              throw 'The manifest signing key contains trailing data.'
            }

            $signatureBytes = $signer.SignData(
              $payloadBytes,
              [Security.Cryptography.HashAlgorithmName]::SHA256,
              [Security.Cryptography.DSASignatureFormat]::
                IeeeP1363FixedFieldConcatenation)
          }
          finally {
            $signer.Dispose()
            [Array]::Clear(
              $privateKeyBytes,
              0,
              $privateKeyBytes.Length)
          }

          $manifestEnvelope = [ordered]@{
            schemaVersion = 2
            signatureAlgorithm = 'ecdsa-p256-sha256'
            payload = [Convert]::ToBase64String($payloadBytes)
            signature = [Convert]::ToBase64String($signatureBytes)
          }
          $manifestPath =
            Join-Path $installer.DirectoryName 'update.json'
          $manifestJson =
            $manifestEnvelope |
              ConvertTo-Json -Depth 2
          [IO.File]::WriteAllText(
            $manifestPath,
            $manifestJson,
            [Text.UTF8Encoding]::new($false))

          gh release upload $tag $checksum $manifestPath --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload signed assets to $tag."
          }
